name: Update Clone Badge

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch clone stats and update Gist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python3 - << 'PYEOF'
          import json, os, urllib.request
          from datetime import datetime

          token   = os.environ['GH_TOKEN']
          gist_id = os.environ['GIST_ID']
          repo    = 'jasperf/dutch-class-materials'

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json',
              'User-Agent': 'clone-badge-action',
          }

          def gh_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def gh_patch(url, data):
              body = json.dumps(data).encode()
              req = urllib.request.Request(
                  url, data=body,
                  headers={**headers, 'Content-Type': 'application/json'},
                  method='PATCH',
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Fetch traffic API (last 14 days, per day)
          traffic = gh_get(f'https://api.github.com/repos/{repo}/traffic/clones')

          # Fetch current state from Gist
          gist     = gh_get(f'https://api.github.com/gists/{gist_id}')
          filename = list(gist['files'].keys())[0]
          current  = json.loads(gist['files'][filename]['content'])

          last_date     = current.get('last_date', '1970-01-01')
          total_clones  = current.get('total_clones', 0)
          total_uniques = current.get('total_uniques', 0)

          # Only add days not yet counted (avoids double-counting on overlapping windows)
          for day in traffic.get('clones', []):
              day_date = day['timestamp'][:10]   # "2026-05-18"
              if day_date > last_date:
                  total_clones  += day['count']
                  total_uniques += day['uniques']
                  last_date      = max(last_date, day_date)

          new_content = json.dumps({
              'total_clones':  total_clones,
              'total_uniques': total_uniques,
              'last_date':     last_date,
          }, indent=2)

          gh_patch(f'https://api.github.com/gists/{gist_id}', {
              'files': {filename: {'content': new_content}}
          })

          print(f'Done — {total_clones} clones | {total_uniques} unique | last date {last_date}')
          PYEOF
